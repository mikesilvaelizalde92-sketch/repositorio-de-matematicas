<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #181818;
            font-family: Arial, sans-serif;
        }

        .calculadora {
            width: 320px;
            padding: 20px;
            background: #292929;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        #pantalla {
            width: 100%;
            height: 70px;
            margin-bottom: 15px;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 30px;
            text-align: right;
        }

        .botones {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 12px;
            background: #444;
            color: white;
            font-size: 22px;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        button:active {
            transform: scale(0.95);
        }

        .operador {
            background: #d88900;
        }

        #limpiar {
            background: #c0392b;
        }

        #igual {
            background: #2980b9;
            grid-row: span 2;
            height: 130px;
        }

        .cero {
            grid-column: span 2;
        }
    </style>
</head>

<body>

    <div class="calculadora">

        <input type="text" id="pantalla" readonly>

        <div class="botones">

            <button id="limpiar">C</button>

            <button class="operador" data-valor="/">÷</button>

            <button class="operador" data-valor="*">×</button>

            <button id="borrar">⌫</button>


            <button data-valor="7">7</button>
            <button data-valor="8">8</button>
            <button data-valor="9">9</button>

            <button class="operador" data-valor="-">−</button>


            <button data-valor="4">4</button>
            <button data-valor="5">5</button>
            <button data-valor="6">6</button>

            <button class="operador" data-valor="+">+</button>


            <button data-valor="1">1</button>
            <button data-valor="2">2</button>
            <button data-valor="3">3</button>

            <button id="igual">=</button>


            <button class="cero" data-valor="0">0</button>

            <button data-valor=".">.</button>

        </div>

    </div>


    <script>

        const pantalla = document.getElementById("pantalla");

        const botones = document.querySelectorAll("[data-valor]");

        const limpiar = document.getElementById("limpiar");

        const borrar = document.getElementById("borrar");

        const igual = document.getElementById("igual");


        let numeroActual = "";

        let numeroAnterior = "";

        let operador = "";


        botones.forEach(function(boton) {

            boton.addEventListener("click", function() {

                const valor = boton.dataset.valor;


                if (
                    valor === "+" ||
                    valor === "-" ||
                    valor === "*" ||
                    valor === "/"
                ) {

                    elegirOperador(valor);

                } else {

                    escribirNumero(valor);

                }

            });

        });


        function escribirNumero(valor) {

            if (valor === "." && numeroActual.includes(".")) {
                return;
            }

            numeroActual += valor;

            pantalla.value = numeroActual;

        }


        function elegirOperador(op) {

            if (numeroActual === "") {
                return;
            }

            numeroAnterior = numeroActual;

            numeroActual = "";

            operador = op;

            pantalla.value = "";

        }


        igual.addEventListener("click", function() {

            if (
                numeroAnterior === "" ||
                numeroActual === "" ||
                operador === ""
            ) {
                return;
            }


            const numero1 = Number(numeroAnterior);

            const numero2 = Number(numeroActual);

            let resultado;


            if (operador === "+") {

                resultado = numero1 + numero2;

            }


            if (operador === "-") {

                resultado = numero1 - numero2;

            }


            if (operador === "*") {

                resultado = numero1 * numero2;

            }


            if (operador === "/") {

                if (numero2 === 0) {

                    pantalla.value = "Error";

                    numeroActual = "";

                    numeroAnterior = "";

                    operador = "";

                    return;

                }

                resultado = numero1 / numero2;

            }


            pantalla.value = resultado;

            numeroActual = String(resultado);

            numeroAnterior = "";

            operador = "";

        });


        limpiar.addEventListener("click", function() {

            numeroActual = "";

            numeroAnterior = "";

            operador = "";

            pantalla.value = "";

        });


        borrar.addEventListener("click", function() {

            numeroActual = numeroActual.slice(0, -1);

            pantalla.value = numeroActual;

        });

    </script>

</body>
</html>
